name: payslip-parser

services:
  payslip-api:
    build:
      context: ../payslip-api
      target: development
    volumes:
      - ../payslip-api:/app
      - /app/node_modules
      - /app/dist
      - payslip-data:/app/storage
    environment:
      - STORAGE_ROOT=/app/storage
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 40s

  payslip-parser-ui:
    build:
      context: ../payslip-parser-ui
      target: development
    volumes:
      - ../payslip-parser-ui:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      payslip-api:
        condition: service_healthy

volumes:
  payslip-data:
