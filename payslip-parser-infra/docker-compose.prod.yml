name: payslip-parser

services:
  payslip-api:
    build:
      context: ../payslip-api
      target: production
    volumes:
      - payslip-data:/app/storage
    environment:
      - STORAGE_ROOT=/app/storage
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 8s
    restart: unless-stopped

  payslip-parser-ui:
    build:
      context: ../payslip-parser-ui
      target: production
    volumes:
      - ../payslip-parser-infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      payslip-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  payslip-data:
